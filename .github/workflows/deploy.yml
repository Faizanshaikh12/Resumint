name: Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    environment:
      name: production
      url: https://resumint.dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Apply Remote D1 Database Migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      - name: Seed Remote D1 Templates (Idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:seed:templates:remote

      - name: Build Production Bundle
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Post-Deploy Smoke Test (/health & /)
        env:
          PROD_URL: https://resumint.faizan-shaikh-dev.workers.dev
        run: |
          echo "Verifying health endpoint at $PROD_URL/health (retrying up to 3 times, 5s apart)..."
          HEALTH_OK=0
          for i in 1 2 3; do
            echo "Attempt $i checking $PROD_URL/health..."
            HEALTH_STATUS=$(curl -sS -o health_body.txt -w "%{http_code}" "$PROD_URL/health" || echo "000")
            echo "Health check HTTP status: $HEALTH_STATUS"
            if [ "$HEALTH_STATUS" = "200" ]; then
              echo "Health check response body:"
              cat health_body.txt
              echo ""
              HEALTH_OK=1
              break
            fi
            echo "Response body on attempt $i:"
            cat health_body.txt
            echo ""
            if [ "$i" -lt 3 ]; then
              sleep 5
            fi
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "Smoke test error: /health failed after 3 attempts with status $HEALTH_STATUS"
            exit 1
          fi

          echo "Verifying root route at $PROD_URL/ (retrying up to 3 times, 5s apart)..."
          ROOT_OK=0
          for i in 1 2 3; do
            echo "Attempt $i checking $PROD_URL/..."
            ROOT_STATUS=$(curl -sS -o root_body.txt -w "%{http_code}" "$PROD_URL/" || echo "000")
            echo "Root route HTTP status: $ROOT_STATUS"
            if [ "$ROOT_STATUS" = "200" ]; then
              echo "Root route returned 200 OK"
              ROOT_OK=1
              break
            fi
            echo "Response body on attempt $i:"
            cat root_body.txt
            echo ""
            if [ "$i" -lt 3 ]; then
              sleep 5
            fi
          done

          if [ "$ROOT_OK" -ne 1 ]; then
            echo "Smoke test error: / failed after 3 attempts with status $ROOT_STATUS"
            exit 1
          fi
