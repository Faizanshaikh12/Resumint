name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Lint
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Vitest Unit & Component Tests
        run: npm run test:unit

      - name: Vitest Worker Integration Tests (Local D1)
        run: npm run test:worker

      - name: Production Bundle Build
        run: npm run build

  e2e:
    name: Playwright End-to-End & Axe Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Apply Local D1 Migrations
        run: npx wrangler d1 migrations apply DB --local

      - name: Run Playwright Tests (E2E & Accessibility)
        run: npm run test:e2e

